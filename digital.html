        display: flex;
        justify-content: center;
        align-items: center;
        justify-content: space-evenly;
        border: 1px solid transparent;
      }
      /* Slideshow container */
      .slideshow-container {
        max-width: 800px;
        height: 600px;
        overflow: hidden;
        position: relative;
        margin: auto;
        top: 60px;
        border-radius: 60px;
        border: 3px solid black;
      }
      .mySlides video {
        width: 100%; /* Ensures full width of the container */
        height: 600px; /* Fixed height for uniformity */
        object-fit: cover; /* Ensures videos fill the frame while keeping aspect ratio */
      }
      /* Hide the images by default */
      .mySlides {
        display: none;
      }
      
      /* Next & previous buttons */ 
      .prev,
      .next {
        cursor: pointer;
        position: absolute;
        top: 50%;
        width: auto;
        margin-top: -22px;
        padding: 16px;
        color: white;
        font-weight: bold;
        font-size: 18px;
        transition: 0.6s ease;
        border-radius: 0 3px 3px 0;
        user-select: none;
      }

      /* Position the "next button" to the right */
      .next {
        right: 0;
        border-radius: 3px 0 0 3px;
      }

      /* On hover, add a black background color with a little bit see-through */
      .prev:hover,
      .next:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }

      /* Caption text */
      .text {
        color: #f2f2f2;
        font-size: 15px;
        padding: 8px 12px;
        position: absolute;
        bottom: 8px;
        width: 100%;
        text-align: center;
      }

      /* Number text (1/3 etc) */
      .numbertext {
        color: #f2f2f2;
        font-size: 12px;
        padding: 8px 12px;
        position: absolute;
        top: 0;
      }

      /* The dots/bullets/indicators */
      .dot {
        cursor: pointer;
        height: 15px;
        width: 15px;
        margin: 0 2px;
        background-color: #bbb;
        border-radius: 50%;
        display: inline-block;
        transition: background-color 0.6s ease;
      }
      .active,
      .dot:hover {
        background-color: #717171;
      }

      /* Fading animation */
      .fade {
        animation-name: fade;
        animation-duration: 1.5s;
      }

      @keyframes fade {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }

      }

    <script>
      let slideIndex = 1;
      showSlides(slideIndex);

      // Next/previous controls
      function plusSlides(n) {
        showSlides((slideIndex += n));
      }

      // Thumbnail image controls
      function currentSlide(n) {
        showSlides((slideIndex = n));
      }

      function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");

        // Reset slide index if out of bounds
        if (n > slides.length) {
          slideIndex = 1;
        }
        if (n < 1) {
          slideIndex = slides.length;
        }

        // Hide all slides and pause videos
        for (i = 0; i < slides.length; i++) {
          slides[i].style.display = "none";
          let video = slides[i].querySelector("video");
          if (video) video.pause(); // Pause video if present
        }

        // Remove 'active' class from all dots
        for (i = 0; i < dots.length; i++) {
          dots[i].className = dots[i].className.replace(" active", "");
        }

        // Show the current slide and play its video
        slides[slideIndex - 1].style.display = "block";
        let currentVideo = slides[slideIndex - 1].querySelector("video");
        if (currentVideo) currentVideo.play(); // Play video if present

        dots[slideIndex - 1].className += " active";
      }
    </script>
